name: AGTools
description: >-
  Agtools, Inc. is an agricultural technology (AgTech) company providing a
  real-time data analytics and market-intelligence SaaS platform for the global
  food supply chain. The platform aggregates and curates hundreds of official
  government, institutional, university, and weather data sources covering 450+
  specialty crops and commodities across 189+ countries, exposing 70+ variables
  and 25+ years of historical records (pricing, supply, demand, exchange rates,
  weather, CO2 footprint, and transportation costs) through dashboards, daily
  commodity reports, and a price analyzer so growers, shippers, buyers, and
  retailers can forecast demand, manage purchase orders, and reduce food waste.
  Founded in 2017 and headquartered in Irvine, California, Agtools is a Techstars
  Farm to Fork alumnus and Microsoft Machine Learning & AI award winner. No
  public developer API or OpenAPI surface has been published to date.
